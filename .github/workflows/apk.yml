name: Fabriquer l'APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - name: Preparer le dossier www
        run: |
          mkdir -p www
          for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png; do if [ -f "$f" ]; then cp "$f" www/; fi; done
          test -f www/index.html
      - run: npx cap add android
      - name: Autorisations (notifications, alarmes exactes, redemarrage)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Cle de signature fixe (mises a jour sans desinstaller)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; else echo "Secret DEBUG_KEYSTORE absent : cle aleatoire"; fi
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: planning-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
